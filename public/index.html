<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="input.js" defer></script>
    <link rel="stylesheet" href="/input.css">
</head>
<body>
    <h2>This is a demo for collecting excel data</h2>
    <header>
        <nav>
            <ul>
                <li>Import</li>
                <li>Update</li>
                <li>Search</li>
            </ul>
        </nav>
    
    </header>
    <section>
        <h3>Input section</h3>
        <form id="inputForm">
            <div>
                <label for="file">Choose your excel file</label>
                <input type="file" id="file" name="file" accept=".xlsx, .xls">
            </div>
    
            <div>
                <label for="appl">Application number:</label>
                <input type="text" id="appl" name="appl" required placeholder="necessary">
            </div>

            <div>
                <label for="certf">Certificate number:</label>
                <input type="text" id="certf" name="certf" placeholder="optional">
            </div>
    
            <button type="submit">Submit</button>
        </form>
    </section>

    <section>
        <h3>Update existing info</h3>
    </section>


    <section>
        <h3>Search section</h3>
        <form id="applicationForm">
            <div>
                <label for="applSearch">Enter your application number</label>
                <input type="search" id="applSearch" name="applSearch">
                <button>Appl Search</button>
            </div>
        </form>

        <form id="certificateForm">
            <div>
                <label for="certfSearch">Enter your certificate number</label>
                <input type="search" id="certfSearch" name="certfSearch">
                <button>Certf Search</button>
            </div>
        </form>
    </section>

    <!-- <a href="/result?application=A2025CCC0717-4897575" target="_blank">Open result</a>
    <br>
    <a href="/result?application=A2025CCC0717-1233456" target="_blank">Open result</a> -->

    <!-- When there is a search result, show the link(s) in <pre> -->
    <pre></pre>
    <div id="records"></div> 
    
</body>
</html>
