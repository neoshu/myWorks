<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="input.js" defer></script>
</head>
<body>
    <h2>This is a demo for collecting excel data</h2>
    <form>
        <div>
            <label for="file">Choose your excel file</label>
            <input type="file" id="file" name="file" accept=".xlsx, .xls">
        </div>

        <div>
            <label for="appl">Application:</label>
            <input type="text" id="appl" name="appl" required>
        </div>

        <button type="submit">Submit</button>
    </form>
    <pre></pre>
    
</body>
</html>
