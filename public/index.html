<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="input.js" defer></script>
</head>
<body>
    <h2>This is a demo for collecting excel data</h2>
    <section>
        <h3>Input section</h3>
        <form id="inputForm">
            <div>
                <label for="file">Choose your excel file</label>
                <input type="file" id="file" name="file" accept=".xlsx, .xls">
            </div>
    
            <div>
                <label for="appl">Application:</label>
                <input type="text" id="appl" name="appl" required>
            </div>
    
            <button type="submit">Submit</button>
        </form>
    </section>

    <section>
        <h3>Search section</h3>
        <form id="searchForm">
            <label for="applSearch">Enter your application number</label>
            <input type="search" id="applSearch" name="applSearch">
            <button>Search</button>
        </form>
    </section>

    <a href="/result?application=A2025CCC0717-4897575" target="_blank">Open result</a>
    <br>
    <a href="/result?application=A2025CCC0717-1233456" target="_blank">Open result</a>

    <pre></pre>
    
</body>
</html>
